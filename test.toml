# implementer · cost-conscious
#
# makes it work, in the smallest change that does
#
# Generated by compose.py -- edit the role and persona prompts, not this file.
#
#   capwrap up examples/roles-and-personas/built/pi-implementer-cost-conscious.toml

name = "pi-implementer-cost-conscious"

[runtime]
agent = "pi"
command = ["node", "/opt/pi/pi-agent/dist/bundle/cli.js", "--thinking", "high"]
# Role and persona are one system prompt: it survives compaction, and the
# agent cannot talk itself out of either halfway through a session.  capwrap
# binds the file and delivers it natively for whichever agent this runs.
role_prompt = "pi-implementer-cost-conscious.md"
cwd       = "/work"
tty       = true
approvals = "capwrap"
# Where the agent's plain questions surface: "forward" (the operator's console
# Questions tab), "block" (no console card; the agent states its question in
# its own terminal and ends its turn), or "auto" (autonomous mode: the
# question is auto-answered "use best judgment, note it" and recorded for
# later review).  Permission requests and escalations always create cards.
question_routing = "forward"

auto_allow = ["read", "glob", "grep", "Write", "Edit", "bash(ls*)", "bash(find*)", "bash(cat*)", "bash(grep*)", "bash(rg*)", "bash(head*)", "bash(tail*)", "bash(wc*)", "bash(sort*)", "bash(uniq*)", "bash(diff*)", "bash(stat*)", "bash(file*)", "bash(tree*)", "bash(which*)", "bash(pwd)", "bash(echo*)", "bash(cd*)", "bash(mkdir*)", "bash(node *)", "bash(git status*)", "bash(git log*)", "bash(git diff*)", "bash(git show*)", "bash(git branch --list*)", "bash(capctl recv*)", "bash(capctl send*)", "bash(capctl ask*)", "bash(make*)", "bash(cargo*)", "bash(go*)", "bash(just*)", "bash(cmake*)", "bash(ninja*)", "bash(meson*)", "bash(gradle*)", "bash(./gradlew*)", "bash(mvn*)", "bash(./mvnw*)", "bash(dotnet*)", "bash(mix*)", "bash(./scripts/*)", "bash(pytest*)", "bash(python*)", "bash(python3*)", "bash(pip*)", "bash(pip3*)", "bash(npx*)", "bash(npm*)", "bash(yarn*)", "bash(pnpm*)", "bash(bun*)", "bash(ruff*)", "bash(mypy*)", "bash(pyright*)", "bash(tsc*)", "bash(prettier*)", "bash(eslint*)", "bash(touch*)", "bash(cp*)", "bash(mv*)", "bash(sed*)", "bash(rm*)", "bash(chmod*)", "bash(ln*)", "bash(tar*)", "bash(unzip*)", "bash(env)", "bash(date)", "bash(sleep*)", "bash(git add*)", "bash(git commit*)", "bash(git stash*)", "bash(git checkout*)", "bash(git merge*)", "bash(git rebase*)", "bash(git branch*)"]
auto_deny  = ["bash(sudo *)", "bash(curl *)", "bash(wget *)", "bash(rm -rf *)"]

env_from_host = ["OPENCODE_API_KEY"]

[sandbox]
network  = false
hostname = "pi-implementer-cost-conscious"
unshare  = ["pid", "ipc", "uts", "cgroup"]


[[mounts]]
src  = "/home/vagvaz/.local/lib/node_modules/@earendil-works/pi-coding-agent"
dest = "/opt/pi/pi-agent"
mode = "ro"

[[mounts]]
src  = "~/.pi/agent"
dest = "/home/agent/.pi/agent"
mode = "copy"

[[mounts]]
src        = "~/capwrap-demo/repo"
dest       = "/work"
mode       = "worktree"
branch     = "capwrap/pi-implementer-cost-conscious"
base       = "main"
on_destroy = "keep"
[caps]
parent = ["send"]

[[caps.network]]
name    = "model-api-1"
pattern = '^192\.168\.0\.179:11234$'


